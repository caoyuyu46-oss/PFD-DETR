  config: configs/pfd/system/kfpfd_baseline.yaml
- name: PFD-DETR
  config: configs/pfd/system/kfpfd_full.yaml
evaluation_entrypoint: tools/evaluate_predictions.py
prediction_contract:
  format: COCO result list
  bbox: xywh in original pixels
  image_id: exact annotation image ID
  category_id: exact annotation category ID
  score_floor: 0.001
  max_detections: 100
  native_postprocessing_required: true
record_before_new_run:
- official git commit
- resolved native configuration
- checkpoint SHA-256
- split manifest and annotation SHA-256
- seed
- framework and hardware versions
- native validation/test predictions
notes:
- Retain native external training recipes; do not silently apply the controlled random-initialization
  PFD recipe.
- Dataset paths and one-class adaptation require a native dataset configuration. The
  reference files alone are not a completed full-data experiment.
- Current official snapshot parameter counts need not equal the historical manuscript
  rows.
